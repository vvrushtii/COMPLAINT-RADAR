name: Daily refresh

on:
  schedule:
    - cron: "30 2 * * *"      # every day 02:30 UTC (08:00 IST)
  workflow_dispatch: {}        # lets you also run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-pipeline.txt
      - run: pip install -r requirements-pipeline.txt

      # keep the (large) embedding cache between runs without committing it to git
      - uses: actions/cache@v4
        with:
          path: data/embeddings.npz
          key: embeddings-${{ github.run_id }}
          restore-keys: embeddings-
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-model-v1

      - name: Collect new reviews
        run: python -m radar.collect
      - name: Analyse (sentiment, themes, impact, spike alerts)
        run: python -m radar.analyze

      - name: Commit refreshed data
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data/reviews.csv data/analyzed.csv data/impact.csv data/alerts.csv
          git diff --staged --quiet || (git commit -m "Daily data refresh $(date -u +%F)" && git push)
